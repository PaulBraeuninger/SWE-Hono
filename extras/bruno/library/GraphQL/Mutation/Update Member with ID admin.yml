info:
  name: Update Member with ID admin
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |
      mutation {
        updateMember(
          id: 1
          version: 1
          input: {
            username: "update_graphql"
            firstName: "Update"
            lastName: "Ql"
            gender: MALE
            dateOfBirth: "2000-01-01T00:00:00.000Z"
            memberSince: "2015-01-01T00:00:00.000Z"
            isStudent: false
            emailAddress: "grphql@acme.com"
            interests: ["FANTASY"]
          }
        ) {
          version
        }
      }
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: "{{oidcTokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
    settings:
      autoFetchToken: true
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
