info:
  name: New Member GraphQl Unauthorized
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |
      mutation {
        createMember(
          input: {
            username: "graphql"
            firstName: "Graph"
            lastName: "Ql"
            gender: MALE
            dateOfBirth: "2000-01-01T00:00:00.000Z"
            memberSince: "2015-01-01T00:00:00.000Z"
            isStudent: false
            emailAddress: "grphql@acme.com"
            interests: ["FANTASY"]
            address: { postalCode: "12345", place: "Test" }
            books: [
              {
                name: "GraphQL for Beginners"
                isbn: "9783161484100"
                author: "John Doe"
                genre: NON_FICTION
              }
            ]
          }
        ) {
          id
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].message
      operator: contains
      value: firstName
    - expression: res.body.errors[0].message
      operator: contains
      value: lastName
    - expression: res.body.errors[0].message
      operator: contains
      value: emailAddress
    - expression: res.body.errors[0].message
      operator: contains
      value: address
    - expression: res.body.errors[0].message
      operator: contains
      value: books
    - expression: res.body.errors[0].path
      operator: isArray
    - expression: res.body.errors[0].path
      operator: length
      value: "1"
    - expression: res.body.errors[0].path[0]
      operator: eq
      value: create

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
